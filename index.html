<style>
@font-face{font-family:"Game Thai";src:url("web/fonts/NotoSansThai-Regular.ttf") format("truetype");font-style:normal;font-weight:400;unicode-range:U+0E00-0E7F;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#141414;color:#ece7db;font:16px system-ui}main{max-width:800px;margin:auto;padding:clamp(16px,4vw,42px)}h1{font:small-caps 2rem Georgia;margin:0 0 16px}button,.pick{font:inherit;color:#fff;background:#34312c;border:1px solid #777064;border-radius:5px;padding:.55em .85em;cursor:pointer}button:focus-visible,.pick:focus-within{outline:2px solid #ffdb96}.pick input{position:absolute;width:1px;height:1px;opacity:0}.stage{background:black;border:1px solid #555;position:relative;margin:16px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.panel{position:absolute;bottom:4%;left:4%;right:4%;padding:14px;background:#171614f5;border:1px solid #afa897;white-space:pre-line}.panel p{margin:0 0 10px}.panel button,.panel input{margin:3px}input[type=text]{padding:.55em;font:inherit;max-width:90%}#status{overflow-wrap:anywhere}small{color:#b6b2aa}
body.playing{background:#000}.playing h1,.playing small,.playing #status:not(.error){display:none}.playing main{padding:0;max-width:none;display:grid;min-height:100dvh;align-content:center;justify-items:center}.playing .stage{border:0;margin:0;width:min(100vw,133.3333dvh)}.pad{display:none}
body.playing,body.playing *{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
body.playing :is(input:not([type=file]),textarea,[contenteditable=true]){
  -webkit-user-select:text;user-select:text;
}
.playing .stage{touch-action:none}
.playing .pad,body.preview-pad .pad{display:flex}
.pad{
  --key:clamp(44px,8vmin,60px);
  position:absolute;inset:0;z-index:2;pointer-events:none;
  justify-content:space-between;align-items:flex-end;padding:clamp(6px,1.6vmin,16px);
}
.directions{
  --cross:polygon(34% 0,66% 0,66% 34%,100% 34%,100% 66%,66% 66%,66% 100%,34% 100%,34% 66%,0 66%,0 34%,34% 34%);
  position:relative;isolation:isolate;pointer-events:auto;touch-action:none;user-select:none;
  border-radius:50%;background:radial-gradient(circle,#0c0b0d55 45%,#09080b38 70%,transparent 71%);
  display:grid;grid-template:repeat(3,var(--key))/repeat(3,var(--key))}
.directions::before,.directions::after{content:"";position:absolute;pointer-events:none;clip-path:var(--cross);z-index:-1}
.directions::before{inset:2px;background:#e1d3acaa}
.directions::after{inset:4px;background:linear-gradient(145deg,#414046ed,#161518ed)}
.pad .directions button{background:transparent;border:0;box-shadow:none;border-radius:0;color:#e9e3d6}
.pad .directions button.pressed{background:radial-gradient(ellipse,#bd935bbf,transparent 70%);color:#ffdc92;transform:none}
.directions [data-key=up]{grid-area:1/2}
.directions [data-key=left]{grid-area:2/1}
.directions [data-key=right]{grid-area:2/3}
.directions [data-key=down]{grid-area:3/2}
.actions{display:flex;align-items:flex-end;gap:6px;padding-bottom:5px}
.pad button{
  width:var(--key);height:var(--key);padding:0;pointer-events:auto;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  display:grid;place-content:center;gap:1px;text-align:center;
  background:rgba(19,17,22,.66);border:1px solid #e0d5b5aa;border-radius:30%;
  box-shadow:0 1px 4px #0009;color:#faf5e7;font:600 20px/1 system-ui;
}
.pad .actions button{border-radius:50%}
.pad .actions [data-key=ok]{margin-bottom:calc(var(--key)*.63);border-color:#e8c77c;color:#ffe7a8}
.actions span{font:500 10px/1.1 system-ui}
.pad button.pressed{background:#735938e8;border-color:#ffe7a8;transform:scale(.94)}
.toolbar{position:fixed;top:8px;right:8px;z-index:5;display:flex;align-items:center;gap:4px;background:#171717;color:white;border-radius:5px;padding:3px}.volume{display:flex;align-items:center;gap:4px}.volume output{min-width:4ch;text-align:center;font-variant-numeric:tabular-nums}.volume button{min-width:40px;touch-action:manipulation}
.pad-settings summary{padding:8px 10px;cursor:pointer;color:#ffe7a8;touch-action:manipulation}
.pad-settings .slider-panel{position:absolute;top:calc(100% + 4px);right:0;width:min(240px,94vw);padding:12px;background:#201e20;border:1px solid #777064;border-radius:6px}
.slider-panel label{display:flex;justify-content:space-between;gap:8px}
.slider-row{display:flex;align-items:center;gap:6px}.slider-row button{min-width:44px;min-height:44px;touch-action:manipulation}.slider-panel input{min-width:0;flex:1;touch-action:none;width:100%;height:44px;margin:0;accent-color:#e8c77c}
.cheats summary{cursor:pointer;color:#ffe7a8;padding:10px 8px}
.cheat-panel{position:absolute;top:100%;right:0;width:min(320px,95vw);max-height:70dvh;overflow:auto;background:#201e20;border:1px solid #777064;border-radius:6px;padding:12px}
.cheat-panel label{display:block;margin:6px 0}
.cheat-panel select,.cheat-panel input:not([type=checkbox]){width:100%;font:inherit;padding:5px}
.cheat-panel form{border-top:1px solid #59544e;margin-top:8px;padding-top:5px}
.cheat-panel output{display:block;margin-top:8px;color:#ffe7a8}
#gpu-screen,#crt-screen,#scale-screen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#gpu-screen[hidden],#crt-screen[hidden],#scale-screen[hidden]{display:none}.renderer-info{margin-top:8px;font-size:.85rem}.renderer-info output{color:#e8c77c}.slider-panel .crt-option{align-items:center;justify-content:flex-start;margin-top:6px}.crt-option input[type=checkbox]{flex:none;width:20px;height:20px}
.slider-panel .upscale-option{align-items:center;margin-top:8px}.upscale-option select{font:inherit;min-height:44px;padding:4px 8px;background:#34312c;color:#ffe7a8;border:1px solid #777064;border-radius:5px}.upscale-option select:focus-visible{outline:2px solid #ffdb96}.slider-panel{max-height:calc(100dvh - 64px);overflow:auto}.filter-status{font-size:.85rem;color:#e8c77c}
#travel-status{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10001;background:#171614;color:#ffe8b8;border:1px solid #b5a16d;border-radius:6px;padding:10px 15px;max-width:90vw;pointer-events:none;font-size:.95rem}#autosave-status{position:absolute;left:8px;top:8px;z-index:3;pointer-events:none;background:#171614eb;color:#ffe8b8;border-radius:4px;padding:4px 9px;font-size:.85rem}
.save-transfer summary{cursor:pointer;color:#ffe7a8;padding:10px 8px}.save-transfer .cheat-panel button{margin:5px 2px}.save-transfer output{white-space:normal;overflow-wrap:anywhere}.save-transfer select{background:#34312c;color:#fff}
</style>
